<html lang="en">
<head>

<style>
  /* tokens copied from the talk deck (index.html) */
  :root{
    --bg:#0a0c11; --panel:#121620; --panel2:#0d1018; --fg:#e9ebf2; --muted:#8b92a6;
    --border:rgba(255,255,255,.09);
    --danger:#ff5d5d; --danger-dim:rgba(255,93,93,.14);
    --safe:#2fd6a3; --safe-dim:rgba(47,214,163,.14);
    --warn:#ffc04d; --warn-dim:rgba(255,192,77,.14);
    --accent:#8aa2ff; --accent-dim:rgba(138,162,255,.14);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%;background:var(--bg)}
  /* design size is 1280x720; in landscape a small script zooms the body to fill the screen */
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:20px;overflow:hidden;
       -webkit-text-size-adjust:100%;display:flex;flex-direction:column;height:100vh;height:100dvh;
       background-image:radial-gradient(1200px 700px at 80% -10%, rgba(255,93,93,.08), transparent 60%),
                        radial-gradient(1000px 700px at -10% 110%, rgba(47,214,163,.06), transparent 60%)}
  #flash{position:fixed;inset:0;background:var(--danger);opacity:0;pointer-events:none;z-index:50;transition:opacity .08s}
  #flash.on{opacity:.5;transition:none}

  /* over-labels (deck style) */
  .lbl{font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

  /* top bar */
  #top{flex:none;display:flex;align-items:flex-end;gap:10px 16px;flex-wrap:wrap;padding:10px 20px 12px;
       background:rgba(13,16,24,.85);border-bottom:1px solid var(--border)}
  #top .brand{font:800 17px/1.1 var(--sans);letter-spacing:-.01em;align-self:center}
  #top .brand span{display:block}
  #top .brand span{color:var(--danger)}
  #top .spacer{flex:1}
  .group{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{font:700 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
       background:transparent;border:1px solid var(--border);border-radius:999px;padding:8px 11px;cursor:pointer}
  .seg button:hover:not(:disabled){color:var(--fg);border-color:rgba(255,255,255,.25)}
  .seg button.sel{color:var(--accent);background:var(--accent-dim);border-color:var(--accent)}
  #modeSeg button[data-mode="naive"].sel{color:var(--danger);background:var(--danger-dim);border-color:var(--danger)}
  #modeSeg button[data-mode="prompted"].sel{color:var(--warn);background:var(--warn-dim);border-color:var(--warn)}
  .seg button.sel.mode-safe{color:var(--safe);background:var(--safe-dim);border-color:var(--safe)}
  .seg button:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
  select{font:700 13px/1 var(--mono);letter-spacing:.06em;color:var(--fg);background:var(--panel);
       border:1px solid var(--border);border-radius:999px;padding:8px 12px;max-width:250px;text-overflow:ellipsis;cursor:pointer}
  select option{background:var(--panel);color:var(--fg)}
  .btn{background:var(--danger);color:#fff;border:1px solid var(--danger);border-radius:999px;padding:10px 20px;
       font:800 15px/1 var(--sans);letter-spacing:.02em;cursor:pointer;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.45;cursor:progress}
  .btn.safe{background:var(--safe);border-color:var(--safe);color:#04150f}
  .btn.ghost{background:transparent;border-color:var(--warn);color:var(--warn)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .toggle{display:flex;align-items:center;gap:8px;color:var(--muted);font:700 13px/1 var(--mono);letter-spacing:.1em;
       text-transform:uppercase;cursor:pointer;user-select:none;align-self:center;white-space:nowrap}
  .toggle .box{width:36px;height:20px;border-radius:10px;background:#272c3a;position:relative;transition:background .15s;flex:none}
  .toggle .box::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on{color:var(--warn)}
  .toggle.on .box{background:var(--warn)}
  .toggle.on .box::after{left:19px}

  /* stage: two cards side by side */
  #stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;padding:14px 20px 16px}
  .col{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .col h2{flex:none;font:700 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
       padding:13px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .col h2 .lbl{font-size:12px}
  .col .body{flex:1;overflow:auto;overflow-x:hidden;padding:16px 18px 84px}  /* room under the verdict pill */

  /* victim side: chat */
  .msg{margin-bottom:14px;display:flex;flex-direction:column}
  .who{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .bubble{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px 16px;font-size:21px;line-height:1.4;
       white-space:pre-wrap;overflow-wrap:anywhere;max-width:92%;align-self:flex-start}
  .bubble.user{background:#2a3a7a;border-color:#3a4c94;color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
  .msg:has(.bubble.user) .who{align-self:flex-end}

  /* victim side: tool calls */
  .trace{font-family:var(--mono)}
  .call{border:1px solid var(--border);border-left:4px solid rgba(47,214,163,.45);background:rgba(255,255,255,.02);
       border-radius:0 12px 12px 0;padding:9px 13px;margin:10px 0 4px}
  .call .nm{font-weight:700;font-size:19px;line-height:1.3;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;color:#c9cedb;overflow-wrap:anywhere}
  .call .ic{display:inline-grid;place-items:center;width:1.35em;height:1.35em;border-radius:50%;font:800 15px/1 var(--mono);
       color:var(--safe);background:var(--safe-dim);flex:none}
  .call .ic::before{content:"\2713"}
  .call .args{color:#aab2c5;font-family:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:5px;font-size:17px;line-height:1.4}
  .pill{display:inline-block;font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid currentColor}
  .pill.side{color:var(--warn);background:var(--warn-dim)}
  /* side effect, waiting for its result */
  .call.side{border-left-color:var(--warn);background:var(--warn-dim)}
  .call.side .ic{color:var(--warn);background:var(--warn-dim)}
  .call.side .ic::before{content:"!"}
  .call.side .nm{color:var(--fg)}
  /* side effect that went through and was legitimate */
  .call.side.ok{border-left-color:var(--safe);background:rgba(47,214,163,.05)}
  .call.side.ok .ic{color:var(--safe);background:var(--safe-dim)}
  .call.side.ok .ic::before{content:"\2713"}
  /* blocked by safe mode */
  .call.blocked{border-left-color:var(--safe);background:var(--safe-dim)}
  .call.blocked .ic{color:#04150f;background:var(--safe)}
  .call.blocked .ic::before{content:"\2713"}
  .call.blocked .nm::after{content:"blocked";font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
       padding:5px 9px;border-radius:999px;color:var(--safe);border:1px solid var(--safe)}
  /* hijacked: data or money went to the attacker */
  .call.hit{border-color:rgba(255,93,93,.5);border-left-color:var(--danger);background:rgba(255,93,93,.12)}
  .call.hit .nm{color:#fff}
  .call.hit .ic{color:#fff;background:var(--danger)}
  .call.hit .ic::before{content:"\2717"}
  .call.hit .pill.side{color:var(--danger);background:var(--danger-dim)}
  .call.hit .nm::after{content:"hijacked";font:800 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
       padding:5px 9px;border-radius:999px;color:#fff;background:var(--danger)}
  .call.hit .args{color:#ffd0d0}
  .res{border-left:4px solid #2a3042;background:var(--panel2);border-radius:0 10px 10px 0;padding:8px 13px;margin:0 0 10px 18px;
       color:#9aa3b8;font-family:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.4}
  .res.blocked{border-left-color:var(--safe);color:var(--safe);background:rgba(47,214,163,.06)}
  .res.hit{border-left-color:var(--danger);color:#ffb3b3;background:rgba(255,93,93,.06)}

  /* attacker side */
  .acol{background:linear-gradient(180deg,#170b10,#0d0809);border-color:rgba(255,93,93,.22);transition:box-shadow .3s,border-color .3s}
  .acol h2{color:var(--danger)}
  .acol h2 .who-atk{font:700 14px/1 var(--mono);letter-spacing:.02em;text-transform:none;color:#ffb3b3}
  .acol h2 .st{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
       color:var(--muted);border:1px solid var(--border);white-space:nowrap}
  .acol h2 .st::before{content:"\25CF  waiting"}
  .acol.pwned{border-color:var(--danger);box-shadow:0 0 0 2px var(--danger-dim) inset,0 0 40px rgba(255,93,93,.25)}
  .acol.pwned h2{background:var(--danger);color:#fff;border-bottom-color:var(--danger)}
  .acol.pwned h2 .who-atk{color:#fff}
  .acol.pwned h2 .st{color:var(--danger);background:#fff;border-color:#fff}
  .acol.pwned h2 .st::before{content:"\25CF  data received"}
  .counters{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .counter{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .counter .n{font:800 46px/1 var(--mono);color:var(--muted);overflow-wrap:anywhere}
  .counter .k{font:600 11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .acol.pwned .counter{background:var(--danger-dim);border-color:rgba(255,93,93,.5)}
  .acol.pwned .counter .n{color:var(--danger)}
  .loot{border-left:4px solid var(--danger);background:rgba(255,93,93,.10);border-radius:0 10px 10px 0;padding:10px 13px;margin:8px 0;
       font-family:var(--mono);font-size:18px;line-height:1.4;color:#ffd0d0;overflow-wrap:anywhere;animation:lootin .35s ease}
  @keyframes lootin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
  .empty{color:var(--muted);font-style:italic;padding:8px 0;font-size:19px}

  /* banner + approval */
  #banner{flex:none;display:none;background:var(--warn);color:#1a1200;padding:10px 20px;font:700 17px/1.3 var(--sans)}
  #banner.on{display:block}
  #approval{display:none;position:fixed;inset:0;background:rgba(5,6,10,.72);z-index:40;align-items:center;justify-content:center;padding:16px}
  #approval.on{display:flex}
  .modal{background:var(--panel);border:2px solid var(--warn);border-radius:14px;padding:26px 28px;max-width:600px;width:100%;
       box-shadow:0 0 50px rgba(255,192,77,.18)}
  .modal h3{font:800 26px/1.2 var(--sans);margin-bottom:8px;color:var(--warn)}
  .modal .lbl{color:var(--warn)}
  .modal .sum{font-family:var(--mono);font-size:18px;line-height:1.4;color:var(--fg);background:var(--panel2);border:1px solid var(--warn-dim);
       border-radius:10px;padding:12px 14px;margin:14px 0;overflow-wrap:anywhere}
  .modal .acts{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
  .modal .acts .btn{font-size:18px;padding:13px 24px}
  .verdict{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:35;padding:14px 26px;border-radius:999px;
       font:800 21px/1.2 var(--sans);letter-spacing:.01em;display:none;max-width:calc(100% - 32px);text-align:center}
  .verdict.show{display:block;animation:pop .3s ease}
  .verdict.bad{background:var(--danger);color:#fff;box-shadow:0 8px 40px rgba(255,93,93,.45)}
  .verdict.good{background:var(--safe);color:#04150f;box-shadow:0 8px 40px rgba(47,214,163,.35)}
  @keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){.verdict.show,.loot{animation:none}}
  /* reveal: injected text is ALWAYS wrapped; only the body class styles it,
     so toggling R also re-highlights everything already on screen */
  body.reveal .hidden-reveal{color:#1a1200;background:var(--warn);border-radius:4px;padding:0 3px;font-weight:700}
  .pnote{display:none;margin-top:16px;border:1px dashed rgba(255,192,77,.6);border-radius:12px;padding:12px 15px;color:var(--warn);font-size:18px;line-height:1.45}
  .pnote .lbl{color:var(--warn);display:block;margin-bottom:6px}
  body.reveal .pnote.has{display:block}

  /* phone / narrow portrait: stack the panels and let the page scroll */
  @media(max-width:760px){
    body{overflow:auto;height:auto;min-height:100dvh;font-size:17px}
    #top{gap:10px 12px;padding:10px 16px 12px;align-items:flex-start}
    #top .brand{width:100%;font-size:18px}
    #top .brand span{display:inline}
    #top .spacer{display:none}
    .group{max-width:100%}
    select{max-width:100%;width:100%}
    .group:has(select){flex:1 1 100%}
    #stage{flex:none;display:block;padding:12px 16px 16px}
    .col{margin-bottom:12px}
    .col .body{overflow:visible;padding:14px 14px 20px}
    .acol .body{padding-bottom:90px}
    .col h2{flex-wrap:wrap}
    .bubble{font-size:17px;max-width:100%}
    .call .nm{font-size:16px}
    .call .args{font-size:14px}
    .res{font-size:13px;margin-left:8px}
    .loot{font-size:15px}
    .counter .n{font-size:32px}
    .verdict{font-size:16px;bottom:16px}
    .modal{padding:20px}
    .modal h3{font-size:21px}
    .modal .sum{font-size:15px}
  }
</style>
</head>

<script>
"use strict";
const $ = s => document.querySelector(s);
let STATE = {engine:"replay", mode:"naive", scenario:"E1"};
let REVEAL = false;
let SCENARIOS = [];
let RUNNING = false;
let CUR_SCEN = null;   // scenario id of the run on screen (from its status event)

function esc(s){return String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// hidden-text reveal: the scenario's exact injected strings are ALWAYS wrapped
// in .hidden-reveal; body.reveal decides whether they are highlighted, so the
// toggle also works on content that is already on screen.
function renderUntrusted(text){
  let safe = esc(text);
  const sc = SCENARIOS.find(x=>x.id===(CUR_SCEN||STATE.scenario));
  const spans = ((sc && sc.reveal_spans) || []).map(esc).filter(Boolean)
    .sort((a,b)=>b.length-a.length);
  const MARK = '\u0000';  // placeholder so a shorter span never re-wraps a longer one
  const found = [];
  spans.forEach(sp=>{
    if(safe.indexOf(sp)===-1) return;
    safe = safe.split(sp).join(MARK+found.length+MARK);
    found.push(sp);
  });
  return safe.replace(/\u0000(\d+)\u0000/g, (_,i)=>'<span class="hidden-reveal">'+found[Number(i)]+'</span>');
}

function setPresenterNote(id){
  const sc = SCENARIOS.find(x=>x.id===id);
  const note = (sc && sc.presenter_note) || '';
  $('#pnoteText').textContent = note;
  $('#pnote').classList.toggle('has', !!note);
  const atk = document.querySelector('.who-atk');
  if(atk && sc && sc.attacker_email) atk.textContent = sc.attacker_email;
}

async function loadState(){
  const r = await fetch('/api/state'); const s = await r.json();
  SCENARIOS = s.scenarios;
  // engine segment
  const eng = $('#engineSeg'); eng.innerHTML='';
  const order = ['claude','gemini','local','replay'];
  order.forEach(name=>{
    const info = s.engines[name] || {available:false, reason:'unknown'};
    const b = document.createElement('button');
    b.textContent = name;
    if(!info.available){ b.disabled = true; b.title = info.reason; }
    b.onclick = ()=>{ STATE.engine=name; syncSeg('engineSeg', name); };
    eng.appendChild(b);
  });
  // default engine = first available, else replay
  const firstAvail = order.find(n => (s.engines[n]||{}).available);
  STATE.engine = firstAvail || 'replay';
  syncSeg('engineSeg', STATE.engine);
  // mode segment
  const modes = $('#modeSeg'); modes.innerHTML='';
  ['naive','prompted','safe'].forEach(m=>{
    const b=document.createElement('button'); b.textContent=m;
    b.dataset.mode=m;
    b.onclick=()=>{ STATE.mode=m; syncSeg('modeSeg', m); };
    modes.appendChild(b);
  });
  syncSeg('modeSeg','naive');
  // scenario picker
  const sel = $('#scenarioSel'); sel.innerHTML='';
  SCENARIOS.forEach(sc=>{
    const o=document.createElement('option'); o.value=sc.id;
    o.textContent = sc.id+' — '+sc.title; sel.appendChild(o);
  });
  sel.onchange = ()=>{ if(RUNNING) return; STATE.scenario=sel.value; showScenario(); };
  STATE.scenario = SCENARIOS[0] ? SCENARIOS[0].id : 'E1';
  showScenario();
  setRunning(!!s.running);
}

function syncSeg(id, val){
  document.querySelectorAll('#'+id+' button').forEach(b=>{
    const on = (id==='engineSeg' ? b.textContent===val : b.dataset.mode===val);
    b.classList.toggle('sel', on);
    b.classList.toggle('mode-safe', on && val==='safe');
  });
}

function showScenario(){
  const sc = SCENARIOS.find(x=>x.id===STATE.scenario);
  $('#victim').innerHTML =
    '<div class="msg"><div class="who">Scenario</div><div class="bubble">'+
    esc(sc? (sc.id+' — '+sc.title+'\n'+sc.difficulty) : '')+'</div></div>'+
    '<div class="empty">Press Run (or Enter) to start the agent.</div>';
  CUR_SCEN = STATE.scenario;
  setPresenterNote(STATE.scenario);
}

function resetConsole(){
  $('#cEmails').textContent='0';
  $('#cEur').textContent='€0';
  $('#loot').innerHTML='<div class="empty">No loot yet.</div>';
  $('#victim').innerHTML='';
  $('#banner').classList.remove('on');
  $('#verdict').classList.remove('show');
  $('.acol').classList.remove('pwned');
}

function addVictim(html){ const d=document.createElement('div'); d.innerHTML=html; $('#victim').appendChild(d); $('#victim').scrollTop=1e9; }
function addLoot(html){
  const box=$('#loot'); if(box.querySelector('.empty')) box.innerHTML='';
  const d=document.createElement('div'); d.innerHTML=html; box.appendChild(d);
}

function flash(){ const f=$('#flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),150); }

function onEvent(ev){
  switch(ev.type){
    case 'status':
      CUR_SCEN = ev.scenario || STATE.scenario;
      setPresenterNote(CUR_SCEN);
      addVictim('<div class="msg"><div class="who">User</div><div class="bubble user">'+esc(ev.user_prompt)+'</div></div>');
      break;
    case 'step': $('#stepTag').textContent='step '+ev.n; break;
    case 'assistant_text':
      if(ev.text && ev.text.trim())
        addVictim('<div class="msg"><div class="who">Assistant</div><div class="bubble">'+esc(ev.text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</div></div>');
      break;
    case 'tool_call':{
      const side = ev.side_effect ? ' side' : '';
      const pill = ev.side_effect ? '<span class="pill side">side effect</span>' : '';
      addVictim('<div class="call'+side+'" id="call-'+esc(ev.call_id)+'"><div class="nm trace"><span class="ic" aria-hidden="true"></span>'+esc(ev.name)+pill+'</div><div class="args">'+renderUntrusted(JSON.stringify(ev.input))+'</div></div>');
      break;
    }
    case 'tool_result':{
      let cls='res';
      if(ev.blocked) cls+=' blocked';
      // presentational only: colour the matching call card by outcome
      const callEl = document.getElementById('call-'+ev.call_id);
      if(callEl){
        if(ev.blocked) callEl.classList.add('blocked');
        else if(callEl.classList.contains('hit')) cls+=' hit';
        else callEl.classList.add('ok');
      }
      addVictim('<div class="'+cls+'">'+renderUntrusted(ev.output)+'</div>');
      break;
    }
    case 'counter':
      $('#cEmails').textContent=ev.emails_stolen;
      $('#cEur').textContent='€'+ev.eur_charged;
      break;
    case 'loot':{
      // presentational only: the call that produced loot is the hijacked one
      const calls = document.querySelectorAll('#victim .call');
      if(calls.length) calls[calls.length-1].classList.add('hit');
      $('.acol').classList.add('pwned');
      addLoot('<div class="loot">'+ (ev.kind==='money'?'&#128176; ':'&#128231; ') +esc(ev.detail)+'</div>');
      break;
    }
    case 'flash': flash(); break;
    case 'approval_request': showApproval(ev); break;
    case 'approval_resolved': hideApproval(); break;
    case 'error': showBanner(ev.message); break;
    case 'done': showVerdict(ev); $('#stepTag').textContent=''; setRunning(false); break;
  }
}

function showBanner(msg){ const b=$('#banner'); b.textContent='⚠  '+msg; b.classList.add('on'); }
function showVerdict(ev){
  const v=$('#verdict');
  if(ev.hijacked){ v.className='verdict bad show'; v.textContent='HIJACKED — '+(ev.emails_stolen||0)+' email(s), €'+(ev.eur_charged||0)+' charged'; }
  else { v.className='verdict good show'; v.textContent='SAFE — no unauthorised side effects'; }
}

let CUR_CALL=null;
function showApproval(ev){ CUR_CALL=ev.call_id; $('#apSum').textContent=ev.summary; $('#approval').classList.add('on'); }
function hideApproval(){ $('#approval').classList.remove('on'); CUR_CALL=null; }
async function approve(allow){
  if(!CUR_CALL) return;
  await fetch('/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({call_id:CUR_CALL,allow})});
}
$('#apAllow').onclick=()=>approve(true);
$('#apDeny').onclick=()=>approve(false);

function setRunning(v){ RUNNING=v; $('#runBtn').disabled=v; }

async function run(delay){
  if(RUNNING) return;            // one run at a time, whatever triggered it
  setRunning(true);
  resetConsole();
  const body = {engine:STATE.engine,mode:STATE.mode,scenario:STATE.scenario};
  if(delay!==undefined) body.delay = delay;
  try{
    const r = await fetch('/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j = await r.json();
    if(!j.ok){ showBanner(j.error||'could not start run'); syncRunning(); }
  }catch(_){ showBanner('demo server not reachable'); setRunning(false); }
}
// ask the server whether a run is still active (after an SSE reconnect or a
// rejected start) so the Run button can never stay stuck
async function syncRunning(){
  try{ const s = await (await fetch('/api/state')).json(); setRunning(!!s.running); }
  catch(_){ setRunning(false); }
}
$('#runBtn').onclick=()=>run();

// reveal toggle + R key
function setReveal(v){ REVEAL=v; $('#revealToggle').classList.toggle('on',v); document.body.classList.toggle('reveal',v); }
$('#revealToggle').onclick=()=>setReveal(!REVEAL);
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;   // keep Ctrl-R = reload
  const tag = (e.target && e.target.tagName) || '';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if(e.key==='r'||e.key==='R'){ setReveal(!REVEAL); return; }
  // a focused button already activates on Enter; handling it here too would
  // start a second run
  if(e.key==='Enter' && tag!=='BUTTON' && !$('#approval').classList.contains('on')){ e.preventDefault(); run(); }
});

// SSE
function connect(){
  const es = new EventSource('/events');
  es.onopen = () => { syncRunning(); };
  es.onmessage = e => { try{ onEvent(JSON.parse(e.data)); }catch(_){} };
  es.onerror = () => { es.close(); setTimeout(connect, 1000); };
}
connect();
// optional auto-run for screenshots/rehearsal: ?auto=E1:naive&delay=0&reveal=1
async function maybeAuto(){
  const q = new URLSearchParams(location.search);
  const auto = q.get('auto');
  if(!auto) return;
  const [sid, mode] = auto.split(':');
  await new Promise(r=>setTimeout(r,250)); // let loadState finish
  if(sid){ STATE.scenario=sid; const sel=$('#scenarioSel'); if(sel) sel.value=sid; }
  if(mode){ STATE.mode=mode; syncSeg('modeSeg',mode); }
  STATE.engine='replay'; syncSeg('engineSeg','replay');
  if(q.get('reveal')==='1') setReveal(true);
  run(q.get('delay')!==null ? Number(q.get('delay')) : undefined);
}
// stage fit (same idea as the deck): in landscape the 1280x720 design is
// zoomed to fill the screen; portrait phones keep the responsive layout at 1:1
function fit(){
  const W = window.innerWidth, H = window.innerHeight;
  const b = document.body;
  if(W > H && W >= 1000){
    const z = Math.min(W/1280, H/720);
    b.style.zoom = z; b.style.width = (W/z)+'px'; b.style.height = (H/z)+'px';
  } else {
    b.style.zoom = ''; b.style.width = ''; b.style.height = '';
  }
}
window.addEventListener('resize', fit);
fit();
loadState().then(maybeAuto);
</script>
